{% if page.layout == "post" and page.ads and site.nlo.adsense and site.nlo.adsense.client %}
  <script
    async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ site.nlo.adsense.client }}"
    crossorigin="anonymous"
  ></script>
{% endif %}

{% if site.nlo.branding and site.nlo.branding.logo_src %}
  <style>
    .site-title img {
      display: block;
      height: 104px;
      width: min(260px, 100%);
      margin-inline: auto;
      object-fit: contain;
      transition: filter 0.4s ease;
    }
    /* Blur the micro placeholder until the real logo swaps in. */
    .site-title img.lqip {
      filter: blur(8px);
    }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const siteTitle = document.querySelector("a.site-title");
      if (!siteTitle || siteTitle.querySelector("img")) return;

      const logo = document.createElement("img");
      const realSrc = "{{ site.nlo.branding.logo_src | relative_url }}";
      logo.alt = "{{ site.nlo.branding.logo_alt | default: site.social.name | default: site.title | escape }}";
      logo.decoding = "async";

      {%- if site.nlo.branding.logo_lqip %}
      // Show the LQIP placeholder first so no alt text flashes, then swap to
      // the full logo once it has loaded (generate via tools/generate-lqip.sh).
      logo.src = "{{ site.nlo.branding.logo_lqip }}";
      logo.classList.add("lqip");
      const full = new Image();
      full.onload = () => {
        logo.src = realSrc;
        logo.classList.remove("lqip");
      };
      full.src = realSrc;
      {%- else %}
      logo.src = realSrc;
      logo.loading = "lazy";
      {%- endif %}

      siteTitle.textContent = "";
      siteTitle.setAttribute(
        "aria-label",
        "{{ site.nlo.branding.logo_aria_label | default: site.social.name | default: site.title | escape }}"
      );
      siteTitle.appendChild(logo);
    });
  </script>
{% endif %}
